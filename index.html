<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delt Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+Pro:ital,wght@1,400;1,600&display=swap" rel="stylesheet">

<style>
  /* ── Brand typography — Codec Pro (primary, §4.1) ──
     Disabled: woff2 files not shipped; stack falls through to Manrope. */
  /* @font-face declarations removed to eliminate 404s; Manrope is used as primary. */

  * { box-sizing: border-box; }

  /* ── Prevent horizontal scroll site-wide ── */
  html, body { overflow-x: hidden; max-width: 100vw; }

  /* ── Base: mobile-only alternates are hidden on desktop ── */
  [data-v1-comparison-mobile],
  [data-v1-capital-picker-mobile] { display: none; }

  /* ── Mobile responsive layer (<= 768px) ──
     Site uses inline styles, so !important is used selectively
     to override the desktop inline styles at the mobile breakpoint. */
  @media (max-width: 768px) {
    /* Universal containment so nothing forces horizontal overflow */
    body * { max-width: 100vw; }

    /* Headers: shrink padding, allow wrap */
    header > div { padding: 12px 16px !important; flex-wrap: wrap !important; }

    /* Hero / section typography downsize */
    [data-v1-hero-title] { font-size: clamp(32px, 8vw, 56px) !important; line-height: 1.05 !important; letter-spacing: -0.01em !important; }
    [data-v1-section-title] { font-size: clamp(26px, 6.5vw, 42px) !important; line-height: 1.1 !important; }

    /* Grids: collapse multi-col to single col */
    [data-v1-grid-2col],
    [data-v1-grid-3col],
    [data-v1-grid-4col] {
      grid-template-columns: 1fr !important;
      gap: 16px !important;
    }

    /* Apply modal: stack vertically, full-screen */
    [data-v1-apply-modal] {
      grid-template-columns: 1fr !important;
      max-width: 100% !important;
      width: 100% !important;
      max-height: 100vh !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }
    [data-v1-apply-modal] aside {
      padding: 16px !important;
      max-height: 140px !important;
      overflow-y: auto !important;
    }
    [data-v1-apply-modal] [data-v1-apply-body] {
      padding: 20px 16px !important;
    }
    [data-v1-apply-modal-overlay] {
      padding: 0 !important;
      align-items: stretch !important;
    }

    /* Apply form 2-col input grids -> 1 col */
    [data-v1-form-grid] {
      grid-template-columns: 1fr !important;
      gap: 14px !important;
    }

    /* Modal footer (skip/continue) — allow wrap */
    [data-v1-modal-footer] {
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    /* Tickers: smaller text */
    [data-v1-ticker] { font-size: 10px !important; }

    /* Desktop nav hidden, hamburger shown */
    [data-v1-desktop-nav] { display: none !important; }
    [data-v1-mobile-nav-toggle] { display: inline-flex !important; }

    /* Tap targets - min 44px */
    a, button { min-height: 44px; }

    /* Sections: lower padding */
    [data-v1-section] {
      padding-left: 16px !important;
      padding-right: 16px !important;
      padding-top: 48px !important;
      padding-bottom: 48px !important;
    }

    /* Cards / comparison tables - allow scroll, full width */
    [data-v1-table-wrap] { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
    [data-v1-comparison] { font-size: 13px !important; }

    /* Forms: input min-height 44px, font-size 16px to prevent iOS zoom */
    input, select, textarea { font-size: 16px !important; min-height: 44px; }

    /* Hero video / large images: cap height, zero out desktop bleed */
    video, [data-v1-hero-media] { max-height: 60vh !important; width: 100% !important; height: auto !important; }
    [data-v1-hero-media] { margin: 0 !important; min-height: 240px; }

    /* Images: ensure they scale, but allow explicit inline heights to win
       (logo etc. uses height:28px width:auto and shouldn't be stretched). */
    img { max-width: 100% !important; }

    /* Logo in chrome header / mobile nav — keep at the inline height. */
    header img, [role="dialog"] img { height: 28px !important; width: auto !important; max-width: none !important; }

    /* ── Heavy mobile simplification ──
       Hide decorative / over-complex elements that overwhelm a phone screen. */
    [data-v1-ticker-bar],
    [data-v1-hero-meta],
    [data-v1-hero-substats],
    [data-v1-weeks-faster],
    [data-v1-comparison-desktop],
    [data-v1-capital-picker-desktop],
    [data-v1-decorative] { display: none !important; }

    /* Show mobile-simplified alternates */
    [data-v1-comparison-mobile],
    [data-v1-capital-picker-mobile] { display: block !important; }

    /* Disable decorative animations on mobile (reduce visual noise + save battery) */
    .v1hero-pulse, .v1hero-bob, .v1hero-float, .v1hero-glow { animation: none !important; }

    /* Mobile-simplified comparison cards */
    [data-v1-comparison-mobile] { padding: 0; margin: 0; }
    [data-v1-comparison-mobile] .row {
      background: #0e1733;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
    }
    [data-v1-comparison-mobile] .row .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    [data-v1-comparison-mobile] .row .compare {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    [data-v1-comparison-mobile] .row .compare .bank {
      color: rgba(255,255,255,0.45);
      text-decoration: line-through;
      font-size: 14px;
      flex: 1 1 45%;
      min-width: 0;
    }
    [data-v1-comparison-mobile] .row .compare .delt {
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      flex: 1 1 45%;
      min-width: 0;
      text-align: right;
    }
    [data-v1-comparison-mobile] .row .pill {
      display: inline-block;
      margin-top: 10px;
      font-size: 10.5px;
      font-weight: 600;
      color: #a5f3c9;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Mobile-simplified capital picker as bullet list */
    [data-v1-capital-picker-mobile] {
      padding: 0;
      margin: 16px 0 0;
    }
    [data-v1-capital-picker-mobile] h3 {
      font-size: clamp(20px, 5.5vw, 26px);
      color: #0A2540;
      margin: 0 0 18px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    [data-v1-capital-picker-mobile] ul {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid rgba(10,37,64,0.08);
    }
    [data-v1-capital-picker-mobile] li {
      padding: 16px 0;
      border-bottom: 1px solid rgba(10,37,64,0.08);
      color: rgba(10,37,64,0.7);
      font-size: 14px;
      line-height: 1.5;
    }
    [data-v1-capital-picker-mobile] li strong {
      display: block;
      color: #0A2540;
      font-size: 15.5px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    /* Tighten section padding everywhere on mobile */
    section, [data-v1-section] {
      padding-top: 56px !important;
      padding-bottom: 56px !important;
    }
  }
  /* Match the splash background so the first paint is Midnight Steel,
     not white — otherwise the browser flashes white before the splash
     overlay is composited on top. */
  html, body { margin: 0; padding: 0; background: #0c1a2a; font-family: 'Inter', sans-serif; color: #0F0E17; }
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button { font-family: inherit; }
  a { text-decoration: none; color: inherit; }
  input, select, textarea, button { font-family: inherit; }

  /* ── Keyboard focus ring ──
     Restored globally because the app sets outline:none inline on many
     inputs/buttons. !important beats those inline outlines; :focus-visible
     scopes the ring to keyboard navigation (not mouse/touch clicks). */
  :focus-visible {
    outline: 2px solid #4945FF !important;
    outline-offset: 2px;
    border-radius: 3px;
  }

  #app-splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #0c1a2a;
    transition: opacity 280ms ease;
  }
  #app-splash.is-hidden { opacity: 0; pointer-events: none; }
  #app-splash .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.14);
    border-top-color: #4945FF;
    animation: app-splash-spin 0.85s linear infinite;
  }
  @keyframes app-splash-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #app-splash .spinner { animation-duration: 1.6s; }
  }
</style>

<!-- Meta Pixel Code -->
<script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '3142121879304554');
  // Cookie-consent gating: only track once the visitor has accepted cookies.
  // The consent record is written by app/variation-1-cookies.jsx; we read the
  // same key here so a returning, consented visitor is tracked immediately,
  // while an undecided/declined visitor is held via Meta's consent API until
  // they accept (at which point the banner grants consent + fires PageView).
  (function () {
    var choice = null;
    try {
      var raw = window.localStorage.getItem('deltcap:cookie-consent:v1');
      if (raw) { choice = (JSON.parse(raw) || {}).choice; }
    } catch (e) { /* private mode / bad JSON — treat as undecided */ }
    if (choice === 'accepted') {
      fbq('consent', 'grant');
      fbq('track', 'PageView');
    } else {
      fbq('consent', 'revoke'); // hold all tracking until consent is granted
    }
  })();
</script>
<!-- End Meta Pixel Code -->
</head>
<body>
  <!-- Meta Pixel fallback for no-JS visitors. Must live in <body>
       because HTML5 disallows <noscript><img> inside <head>. -->
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=3142121879304554&ev=PageView&noscript=1"
  /></noscript>
  <div id="app-splash" aria-hidden="true"><div class="spinner"></div></div>
  <div id="root"></div>

  <script>
    (function () {
      var root = document.getElementById('root');
      var splash = document.getElementById('app-splash');
      if (!root || !splash) return;
      var hide = function () {
        if (splash.classList.contains('is-hidden')) return;
        splash.classList.add('is-hidden');
        setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 320);
      };
      var observer = new MutationObserver(function () {
        if (root.childElementCount > 0) {
          observer.disconnect();
          requestAnimationFrame(hide);
        }
      });
      observer.observe(root, { childList: true });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Plaid Link SDK (bank connect). The mobile-handoff QR is rendered
       via api.qrserver.com directly in <img>, so no QR JS lib is loaded. -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

  <!-- Meta Pixel event helpers. Plain <script> so window.DeltPixel is
       attached before any Babel-JSX module tries to use it below. -->
  <script src="app/pixel.js"></script>

  <script type="text/babel" src="app/shared.jsx"></script>
  <!-- Wave 2 phrase dictionary — plain JS, must load BEFORE the i18n module -->
  <script src="app/variation-1-phrase-dict.js"></script>
  <script src="app/variation-1-phrase-dict-overrides.js"></script>
  <script type="text/babel" src="app/variation-1-i18n.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
  <script type="text/babel" src="app/variation-1-motion.jsx"></script>
  <script type="text/babel" src="app/variation-1-sections.jsx"></script>
  <script type="text/babel" src="app/variation-1-plaid-sections.jsx"></script>
  <script type="text/babel" src="app/variation-1-calculator.jsx"></script>
  <script type="text/babel" src="app/variation-1-howitworks.jsx"></script>
  <script type="text/babel" src="app/variation-1-reviews.jsx"></script>
  <script type="text/babel" src="app/variation-1-about.jsx"></script>
  <script type="text/babel" src="app/variation-1-booking.jsx"></script>
  <script type="text/babel" src="app/variation-1-support.jsx"></script>
  <script type="text/babel" src="app/variation-1-faq.jsx"></script>
  <script type="text/babel" src="app/variation-1-blog.jsx"></script>

  <script type="text/babel" data-presets="react">
    function Root() { return <Variation1 />; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>

</html>
