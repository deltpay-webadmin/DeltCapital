<!DOCTYPE html>

<head>

<style>
  /* ── Brand typography — Codec Pro (primary, §4.1) ──
     Drop licensed CodecPro-*.woff2 files at /fonts/ to activate. While
     absent, the stack falls through to Manrope (close free stand-in),
     then Inter Tight, then system sans. */
  @font-face { font-family: "Codec Pro"; src: url("/fonts/CodecPro-Regular.woff2")   format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Codec Pro"; src: url("/fonts/CodecPro-Bold.woff2")      format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Codec Pro"; src: url("/fonts/CodecPro-ExtraBold.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
  @font-face { font-family: "Codec Pro"; src: url("/fonts/CodecPro-Heavy.woff2")     format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Codec Pro"; src: url("/fonts/CodecPro-Ultra.woff2")     format("woff2"); font-weight: 950; font-style: normal; font-display: swap; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; font-family: 'Inter', sans-serif; color: #0F0E17; }
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button { font-family: inherit; }
  a { text-decoration: none; color: inherit; }
  input, select, textarea, button { font-family: inherit; }

  /* ── Cookie consent banner ── */
  #dc-cookie-banner {
    position: fixed; left: 16px; right: 16px; bottom: 16px;
    max-width: 720px; margin: 0 auto;
    background: rgba(15, 14, 23, 0.96);
    color: #F7F5F0;
    border: 1px solid rgba(247,245,240,0.12);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5;
    z-index: 9999;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transform-origin: bottom center;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  #dc-cookie-banner.dc-cookie-collapsing {
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    pointer-events: none;
  }
  #dc-cookie-banner .dc-cookie-text { flex: 1; color: rgba(247,245,240,0.85); }
  #dc-cookie-banner .dc-cookie-text a { color: #B8B1FF; text-decoration: underline; }
  #dc-cookie-banner .dc-cookie-actions { display: flex; gap: 8px; flex-shrink: 0; }
  #dc-cookie-banner button {
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
    border: 1px solid rgba(247,245,240,0.18);
    background: transparent; color: rgba(247,245,240,0.85);
    transition: background 0.15s ease, color 0.15s ease;
  }
  #dc-cookie-banner button:hover { background: rgba(247,245,240,0.08); color: #F7F5F0; }
  #dc-cookie-banner button.dc-cookie-accept {
    background: #6C63FF; border-color: #6C63FF; color: #FFFFFF;
  }
  #dc-cookie-banner button.dc-cookie-accept:hover { background: #5b53e8; border-color: #5b53e8; }
  @media (max-width: 560px) {
    #dc-cookie-banner { flex-direction: column; align-items: stretch; gap: 10px; }
    #dc-cookie-banner .dc-cookie-actions { justify-content: flex-end; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <div id="dc-cookie-banner" role="region" aria-label="Cookie consent" hidden>
    <div class="dc-cookie-text">
      We use cookies to operate this site, analyze traffic, and improve your experience. See our <a href="#privacy" id="dc-cookie-learn">privacy policy</a>.
    </div>
    <div class="dc-cookie-actions">
      <button type="button" class="dc-cookie-decline" id="dc-cookie-decline">Decline</button>
      <button type="button" class="dc-cookie-accept" id="dc-cookie-accept">Accept</button>
    </div>
  </div>
  <script>
    (function() {
      try {
        var KEY = 'dc_cookie_consent_v1';
        var banner = document.getElementById('dc-cookie-banner');
        if (!banner) return;
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (e) {}
        if (!stored) { banner.hidden = false; }
        function setChoice(value) {
          try { localStorage.setItem(KEY, JSON.stringify({ choice: value, ts: Date.now() })); } catch (e) {}
          banner.classList.add('dc-cookie-collapsing');
          var done = false;
          var finish = function() {
            if (done) return;
            done = true;
            banner.hidden = true;
            banner.classList.remove('dc-cookie-collapsing');
          };
          banner.addEventListener('transitionend', finish, { once: true });
          setTimeout(finish, 400);
        }
        document.getElementById('dc-cookie-accept').addEventListener('click', function() { setChoice('accepted'); });
        document.getElementById('dc-cookie-decline').addEventListener('click', function() { setChoice('declined'); });
      } catch (e) { /* fail silently */ }
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/variation-1-apply.jsx"></script>
  <script type="text/babel" src="app/variation-1-legal.jsx"></script>
  <script type="text/babel" src="app/variation-1-login.jsx"></script>

    function Root() { return <Variation1 />; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
